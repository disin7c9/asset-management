[project]
name = "asset-management"
version = "2.12.0"
description = "Personal asset-management tool: transaction-log holdings, drawdown-first reporting with confidence bands, multi-source price provenance."
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "empyrical-reloaded>=0.5.11",
    "yfinance>=0.2.40",
    "resend>=2.0",
    "python-dotenv>=1.0",
    "mcp>=1.27.2",
]

[project.scripts]
asset-management = "app.cli:main"
asset-management-mcp = "app.mcp_server:run"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Without a `select` ruff ran its defaults only (E4/E7/E9/F), so every `# noqa: BLE001`,
# `S310`, `PT011` in the tree suppressed a rule that never executed. Select the families the
# code's own suppressions already assume, plus the bug-catching ones; RUF100 then fails the
# gate on a noqa that has gone dead.
select = ["E", "F", "W", "B", "SIM", "BLE", "S", "PT", "RUF100"]
ignore = [
    "E501",   # line length is the formatter's target, not a gate (114 pre-existing overruns)
    "S101",   # `assert` is the test suite's whole vocabulary
    "PT018",  # composite asserts read fine here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S108", "S603", "S607", "SIM300"]   # literal /tmp fixtures, subprocess probes, Yoda asserts
"scripts/*" = ["S603", "S605", "S607"]           # build tooling drives git/uv/python by name on purpose

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
