
name: gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      # reconcile/ is in scope on purpose: it was unlinted and untyped for 50 commits, which is
      # how a dead import in the correctness harness stayed invisible while the README cited it.
      - run: uv run ruff check app/ tests/ scripts/ reconcile/
      - run: uv run mypy app/ scripts/ reconcile/
      - run: uv run pytest -q
